<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A24">
<title>Larch &amp; Canyon — Kenny &amp; Hershania, Sep–Oct 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A24; --ink-2:#31423A; --paper:#FBF9F4; --card:#FFFFFF;
  --larch:#D9A441; --canyon:#B4593A; --glacier:#3F7285; --stone:#6E7A73;
  --line:#E2E0D6; --line-2:#CFCEC2; --ok:#4A7C59; --warn:#C4791F;
  --sh:0 1px 2px rgba(27,42,36,.05),0 4px 14px rgba(27,42,36,.05);
  --d:'Bricolage Grotesque',system-ui,sans-serif;
  --b:'Inter',system-ui,-apple-system,sans-serif;
  --m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--b);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:76px}
h1,h2,h3,h4{font-family:var(--d);margin:0;letter-spacing:-.015em;line-height:1.1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--glacier)}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}

/* ---------- topo backdrop: the signature texture ---------- */
.topo{position:fixed;inset:0;z-index:-1;opacity:.055;pointer-events:none;
  background-image:repeating-radial-gradient(circle at 22% 14%,transparent 0 21px,var(--ink) 21px 22px),
  repeating-radial-gradient(circle at 82% 74%,transparent 0 27px,var(--ink) 27px 28px)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--ink);color:#F4F1E6;
  padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px;
  padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.brand{font-family:var(--d);font-weight:800;font-size:16px;letter-spacing:-.02em;flex:1;min-width:0}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--m);font-weight:400;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:#9DB0A6;margin-top:2px}
.hstat{font-family:var(--m);font-size:10px;text-align:right;color:#9DB0A6;line-height:1.35;white-space:nowrap}
.chip{display:inline-block;margin-top:4px;font-family:var(--m);font-size:8.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:2.5px 7px;border-radius:20px;background:#2C4038;color:#9DB0A6;
  border:1px solid #3A4C43;white-space:nowrap}
.chip.good{color:#8FC79E;border-color:#3E6A4C}
.chip.bad{color:#E9A18C;border-color:#7A4234}
.chip.busy{color:var(--larch);border-color:#6B5220}
@keyframes pul{50%{opacity:.45}}
.chip.busy{animation:pul 1.1s ease-in-out infinite}
.hstat b{display:block;font-family:var(--d);font-size:19px;color:var(--larch);font-weight:800}

/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(251,249,244,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line-2);
  display:flex;padding:5px 3px calc(5px + env(safe-area-inset-bottom)) 3px;
  overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:60px;padding:5px 6px 4px;border-radius:9px;text-align:center;
  color:var(--stone);font-size:9.5px;font-weight:600;letter-spacing:.03em;line-height:1.25}
nav button svg{display:block;margin:0 auto 2px;width:19px;height:19px;stroke-width:1.7;
  stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);background:#EFEDE3}
nav button.on svg{stroke:var(--canyon)}

main{max-width:1080px;margin:0 auto;padding:14px 13px 24px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.pad{padding:13px 14px}
.eyebrow{font-family:var(--m);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--stone);margin-bottom:5px}
.sect-h{display:flex;align-items:baseline;gap:9px;margin:20px 0 9px}
.sect-h h2{font-size:21px;font-weight:800}
.sect-h .n{font-family:var(--m);font-size:10.5px;color:var(--stone);margin-left:auto;text-align:right;max-width:52%;line-height:1.35}
.btn{background:var(--ink);color:#F4F1E6;border-radius:9px;padding:8px 14px;
  font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;
  transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.warn{background:var(--canyon)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;
  padding:8px 10px;background:#fff;font-size:14.5px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--glacier);outline-offset:1px}
label.f{display:block;margin-bottom:9px}
label.f span{display:block;font-family:var(--m);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--stone);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tag{display:inline-block;font-family:var(--m);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;padding:2.5px 7px;border-radius:5px;background:#EFEDE3;color:var(--ink-2)}
.tag.larch{background:#FAF0DA;color:#8A6415}
.tag.canyon{background:#F7E7E1;color:#8A3D24}
.tag.glacier{background:#E2EEF2;color:#2B5060}
.tag.ok{background:#E4EFE6;color:#2F5B3B}
.empty{text-align:center;padding:34px 18px;color:var(--stone)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13.5px;max-width:290px;margin:0 auto}
.hint{font-size:12.5px;color:var(--stone);line-height:1.45}

/* ---------- NOW rail: the signature element ---------- */
.now{background:var(--ink);color:#F4F1E6;border-radius:15px;padding:16px;margin-bottom:14px;
  position:relative;overflow:hidden}
.now:after{content:'';position:absolute;right:-46px;top:-46px;width:150px;height:150px;
  border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.2),transparent 70%)}
.now .lbl{font-family:var(--m);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--larch)}
.now h2{font-size:25px;font-weight:800;margin:5px 0 3px}
.now .sub{color:#A9BBB1;font-size:13px}
.rail{margin-top:14px;border-left:2px solid #3A4C43;padding-left:15px;position:relative}
.rail .ri{position:relative;padding:7px 0;display:flex;gap:11px;align-items:flex-start}
.rail .ri:before{content:'';position:absolute;left:-21px;top:13px;width:9px;height:9px;
  border-radius:50%;background:#3A4C43;border:2px solid var(--ink)}
.rail .ri.now-i:before{background:var(--larch);box-shadow:0 0 0 4px rgba(217,164,65,.22)}
.rail .ri.done{opacity:.42}
.rail .ri .t{font-family:var(--m);font-size:11.5px;color:var(--larch);min-width:40px;padding-top:1px}
.rail .ri .x{font-size:13.5px;line-height:1.4}
.rail .ri.now-i .x{font-weight:600}
.cd{font-family:var(--m);font-size:11px;color:var(--larch);margin-top:2px}

/* ---------- weather ---------- */
.wx{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wxc{flex:0 0 auto;width:75px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 6px;text-align:center}
.wxc .d{font-family:var(--m);font-size:9.5px;color:var(--stone);letter-spacing:.05em}
.wxc .i{font-size:20px;margin:3px 0}
.wxc .hi{font-family:var(--d);font-weight:800;font-size:16px}
.wxc .lo{font-family:var(--m);font-size:11px;color:var(--stone)}
.wxc.est{border-style:dashed;background:#FDFCF8}

/* ---------- day ---------- */
.day{border:1px solid var(--line);border-radius:13px;background:var(--card);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.day.today{border-color:var(--larch);box-shadow:0 0 0 2px rgba(217,164,65,.16),var(--sh)}
.dh{display:flex;gap:11px;align-items:center;padding:12px 13px;width:100%;text-align:left}
.dnum{font-family:var(--d);font-weight:800;font-size:15px;color:#fff;background:var(--ink-2);
  min-width:38px;height:38px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
.dnum small{font-family:var(--m);font-size:8px;font-weight:400;color:#A9BBB1;margin-top:1px}
.day.today .dnum{background:var(--larch);color:var(--ink)}
.day.today .dnum small{color:#6B4E10}
.dt{flex:1;min-width:0}
.dt h3{font-size:15.5px;font-weight:600}
.dt p{font-size:11.5px;color:var(--stone);margin:2px 0 0;font-family:var(--m)}
.chev{color:var(--stone);transition:transform .2s;flex:0 0 auto}
.day.open .chev{transform:rotate(180deg)}
.dbody{display:none;border-top:1px solid var(--line);padding:11px 13px 14px}
.day.open .dbody{display:block}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* ---------- schedule item ---------- */
.si{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F0EEE6;align-items:flex-start}
.si:last-child{border-bottom:none}
.si .tt{font-family:var(--m);font-size:11.5px;font-weight:600;color:var(--ink-2);
  min-width:41px;padding-top:2px;flex:0 0 auto}
.si.key .tt{color:var(--canyon)}
.si .bd{flex:1;min-width:0}
.si .bd b{font-weight:600;font-size:14px}
.si .bd .no{color:var(--stone);font-size:12.5px;display:block;margin-top:2px;line-height:1.45}
.si.done .bd b,.si.done .bd .no{text-decoration:line-through;opacity:.45}
.ck{width:21px;height:21px;border:1.8px solid var(--line-2);border-radius:6px;flex:0 0 auto;
  margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.ck.on svg{opacity:1}

/* ---------- photos ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:9px}
.pslot{aspect-ratio:3/4;border:1.5px dashed var(--line-2);border-radius:9px;background:#FDFCF8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:6px;text-align:center;position:relative;overflow:hidden;cursor:pointer}
.pslot:hover{border-color:var(--glacier);background:#F6FAFB}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;
  background:linear-gradient(transparent,rgba(27,42,36,.85));color:#fff;font-size:10px;
  font-weight:600;text-align:left;line-height:1.25}
.pslot .ph{font-size:9.5px;color:var(--stone);line-height:1.3;font-family:var(--m)}
.pslot .plus{font-size:19px;color:var(--line-2)}
.pdel{position:absolute;top:4px;right:4px;width:21px;height:21px;border-radius:6px;
  background:rgba(27,42,36,.72);color:#fff;font-size:13px;display:flex;
  align-items:center;justify-content:center;z-index:2}

/* ---------- misc ---------- */
.meter{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 3px}
.meter i{display:block;height:100%;background:var(--glacier);transition:width .3s}
.meter i.hi{background:var(--warn)}
.meter i.max{background:var(--canyon)}
.alert{border-left:3px solid var(--canyon);background:#FCF3F0;padding:9px 11px;
  border-radius:0 8px 8px 0;font-size:12.5px;margin:8px 0;line-height:1.45}
.alert.ok{border-color:var(--ok);background:#EFF5F0}
.alert.info{border-color:var(--glacier);background:#EFF5F7}
.alert b{display:block;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.modal{position:fixed;inset:0;z-index:100;background:rgba(27,42,36,.55);
  display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:17px 17px 0 0;padding:17px 16px calc(22px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:3px}
.grip{width:34px;height:4px;background:var(--line-2);border-radius:2px;margin:0 auto 13px}
.toast{pointer-events:none;position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:#F4F1E6;padding:9px 17px;border-radius:22px;font-size:13.5px;
  z-index:200;transition:transform .28s cubic-bezier(.2,.9,.3,1);white-space:nowrap;
  max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translateX(-50%) translateY(0)}
.mapimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid #F0EEE6;font-size:13.5px}
.kv:last-child{border:none}
.kv .k{color:var(--stone)}
.kv .v{font-family:var(--m);font-weight:600;text-align:right}
details.acc{border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:9px}
details.acc>summary{padding:11px 13px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px;font-size:14.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:'+';margin-left:auto;color:var(--stone);font-size:17px}
details.acc[open]>summary:after{content:'−'}
details.acc .ab{padding:0 13px 13px}

@media(min-width:760px){
  body{padding-bottom:0}
  nav{position:sticky;top:58px;bottom:auto;border-top:none;border-bottom:1px solid var(--line-2);
    justify-content:center;padding:5px}
  nav button{flex:0 0 auto;min-width:auto;padding:6px 13px;display:flex;align-items:center;gap:6px;font-size:12.5px}
  nav button svg{margin:0;width:16px;height:16px}
  main{padding:18px 20px 40px}
  .toast{bottom:26px}
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:15px;max-height:82vh}
}

@media print{
  body{padding:0;background:#fff;font-size:10.5pt}
  header,nav,.topo,.noprint,.btn{display:none!important}
  .view{display:none!important}
  .view.printing{display:block!important}
  .card,.day{break-inside:avoid;box-shadow:none;border-color:#ccc}
  .dbody{display:block!important}
  @page{size:A4;margin:15mm}
}
</style>

<script>

/* ═══════════════════════════════════════════════════════════
   PHOTO STORE — IndexedDB
   localStorage caps at about 5 MB and only holds text, so images had
   to be base64, which adds a third to every file. IndexedDB holds real
   Blobs and its quota runs to hundreds of megabytes or more, so the
   only practical ceiling now is the device's free space.
   The small JSON state stays in localStorage; only bytes live here.
   ═══════════════════════════════════════════════════════════ */
const IDB={
 db:null,
 open(){
  if(this.db)return Promise.resolve(this.db);
  return new Promise((res,rej)=>{
   const r=indexedDB.open('larchcanyon',1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};
   r.onsuccess=()=>{this.db=r.result;res(this.db)};
   r.onerror=()=>rej(r.error);
  });
 },
 async tx(mode){const d=await this.open();return d.transaction('blobs',mode).objectStore('blobs')},
 async put(k,blob){const s=await this.tx('readwrite');
  return new Promise((res,rej)=>{const q=s.put(blob,k);q.onsuccess=()=>res(true);q.onerror=()=>rej(q.error)})},
 async get(k){const s=await this.tx('readonly');
  return new Promise(res=>{const q=s.get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
 async del(k){const s=await this.tx('readwrite');
  return new Promise(res=>{const q=s.delete(k);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})},
 async keys(){const s=await this.tx('readonly');
  return new Promise(res=>{const q=s.getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
};

const Photos={
 url:{},          // id -> object URL, created once at boot
 async loadAll(){
  try{
   const keys=await IDB.keys();
   for(const k of keys){
    if(this.url[k])continue;
    const b=await IDB.get(k);
    if(b)this.url[k]=URL.createObjectURL(b);
   }
  }catch(e){console.warn('photo load',e)}
 },
 async add(blob,id){
  id=id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
  await IDB.put(id,blob);
  if(this.url[id])URL.revokeObjectURL(this.url[id]);
  this.url[id]=URL.createObjectURL(blob);
  return id;
 },
 async remove(id){
  if(!id)return;
  if(this.url[id]){URL.revokeObjectURL(this.url[id]);delete this.url[id]}
  await IDB.del(id);
 },
 src(ref){
  if(!ref)return null;
  if(typeof ref==='string')return ref.startsWith('data:')||ref.startsWith('http')?ref:null;
  if(ref.p&&this.url[ref.p])return this.url[ref.p];
  return null;
 },
 async blob(ref){
  if(!ref)return null;
  if(typeof ref==='object'&&ref.p){const b=await IDB.get(ref.p);if(b)return b}
  if(typeof ref==='string'&&ref.startsWith('data:'))return dataUrlToBlob(ref);
  return null;
 },
 async estimate(){
  try{const e=await navigator.storage.estimate();
   return{used:e.usage||0,quota:e.quota||0}}catch(e){return{used:0,quota:0}}
 }
};
function dataUrlToBlob(d){
 const[meta,b64]=d.split(',');const mime=(meta.match(/:(.*?);/)||[,'image/jpeg'])[1];
 const bin=atob(b64);const a=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
 return new Blob([a],{type:mime});
}
function blobToDataUrl(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)})}

/* one-off move of anything already stored as base64 in localStorage */
async function migratePhotos(){
 let moved=0;
 const conv=async v=>{
  if(typeof v!=='string'||!v.startsWith('data:'))return null;
  const id=await Photos.add(dataUrlToBlob(v));moved++;return{p:id};
 };
 for(const[k,v]of Object.entries(S.photos||{})){const r=await conv(v);if(r)S.photos[k]=r}
 for(const[k,o]of Object.entries(S.outfits||{})){
  if(!o)continue;
  for(const f of['img','img2']){const r=await conv(o[f]);if(r)o[f]=r}
 }
 for(const d of(S.docs||[])){const r=await conv(d.img);if(r)d.img=r}
 if(moved){await Store.save();toast(`Moved ${moved} photo${moved===1?'':'s'} to the larger store`)}
 return moved;
}

/* one-off repair for refs from the pre-IndexedDB era: {f} with no p.
   Those files still exist in the sync repo under their old name, and that
   name IS the id the current scheme would have used, so p is derivable. */
async function migrateFileRefs(){
 let fixed=0;
 const repair=ref=>{
  if(!ref||typeof ref!=='object')return false;
  if(typeof ref.f!=='string'||!ref.f.endsWith('.jpg'))return false;
  if(ref.p)return false;
  const base=ref.f.split('/').pop();
  const id=base.slice(0,-4);
  if(!id)return false;
  ref.p=id;fixed++;return true;
 };
 for(const[k,v]of Object.entries(S.photos||{})){if(repair(v))touch('photos',k)}
 for(const[k,o]of Object.entries(S.outfits||{})){
  if(!o)continue;
  let hit=false;
  for(const f of['img','img2']){if(repair(o[f]))hit=true}
  if(hit)touch('outfits',k);
 }
 for(const d of(S.docs||[])){if(repair(d.img))touch('docs',d.id)}
 if(fixed){await Store.save();if(typeof Sync!=='undefined'&&Sync.nudge)Sync.nudge()}
 return fixed;
}

/* ═══════════════════ STORAGE ═══════════════════
   Works in two places: Claude artifacts (window.storage) and any
   normal browser / GitHub Pages (localStorage). Same API either way. */
const Store={
  mem:{}, ready:false, failed:false,
  get remote(){return typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function'},
  async load(){
    try{
      if(this.remote){
        try{const r=await window.storage.get('trip');if(r&&r.value)this.mem=JSON.parse(r.value)}catch(e){this.mem={}}
      }else{
        const r=localStorage.getItem('larchcanyon');if(r)this.mem=JSON.parse(r);
      }
    }catch(e){console.warn('load failed',e);this.mem={}}
    this.ready=true;return this.mem;
  },
  async save(){
    this.mem=S;                       // S is rebuilt at boot, so re-point every time
    const s=JSON.stringify(this.mem);
    try{
      if(this.remote){await window.storage.set('trip',s)}
      else{localStorage.setItem('larchcanyon',s)}
      if(this.failed){this.failed=false;if(typeof paintSync==='function')paintSync()}
      return true;
    }catch(e){
      // a silent failure here means the edit exists only in memory and dies
      // with the tab, so it has to reach the header, not just a toast
      this.failed=true;
      if(typeof paintSync==='function')paintSync();
      toast(e&&/quota/i.test(e.message||'')?'Could not save settings — device storage is full':'Could not save');
      return false;
    }
  },
  bytes(){try{return new Blob([JSON.stringify(this.mem)]).size}catch(e){return JSON.stringify(this.mem).length}}
};
const CAP=4.4*1024*1024; // practical browser ceiling

let S={done:{},items:{},bookings:[],photos:{},outfits:{},docs:[],todos:{},packing:{},spend:[],notes:{},cards:[],v:1};
/* Every edit lands on the device immediately, then schedules a push. Without the
   nudge an edit only left the phone on the 5-minute timer — or never, if the app
   was closed first. */
const save=()=>{
 Store.mem=S;
 const ok=Store.save();
 if(typeof Sync!=='undefined'&&Sync.nudge)Sync.nudge();
 return ok;
};


/* ═══════════════════════════════════════════════════════════
   LIVE FX
   Mid-market rates from ExchangeRate-API's open endpoint — no key,
   CORS-open, 161 currencies. Cached locally so the app still converts
   with no signal, showing the date the rate was taken.
   Card rates are then derived per card: banks settle at roughly the
   network rate plus their own markup, which no public API exposes,
   so each card carries the markup you enter for it.
   ═══════════════════════════════════════════════════════════ */
const FX={
 rates:null, at:null, stale:false,
 FALLBACK:{IDR:16500,CAD:1.37,USD:1},
 load(){
  try{const c=JSON.parse(localStorage.getItem('larchcanyon.fx')||'null');
   if(c&&c.rates){this.rates=c.rates;this.at=c.at}}catch(e){}
  if(!this.rates){this.rates=this.FALLBACK;this.at=null}
 },
 async refresh(force){
  const age=this.at?(Date.now()-new Date(this.at).getTime())/36e5:1e9;
  if(!force&&age<6)return this.rates;
  if(!navigator.onLine){this.stale=true;return this.rates}
  try{
   const r=await fetch('https://open.er-api.com/v6/latest/USD');
   if(!r.ok)throw 0;
   const j=await r.json();
   if(!j.rates||!j.rates.IDR)throw 0;
   this.rates={IDR:j.rates.IDR,CAD:j.rates.CAD,USD:1};
   this.at=j.time_last_update_utc||new Date().toISOString();
   this.stale=false;
   localStorage.setItem('larchcanyon.fx',JSON.stringify({rates:this.rates,at:this.at}));
  }catch(e){this.stale=true}
  return this.rates;
 },
 /* mid-market: 1 unit of `cur` in IDR */
 idr(cur){
  const r=this.rates||this.FALLBACK;
  if(cur==='IDR')return 1;
  if(cur==='USD')return r.IDR;
  if(!r[cur])return r.IDR;
  return r.IDR/r[cur];            // USD->IDR divided by USD->cur
 },
 age(){
  if(!this.at)return 'no live rate yet';
  const d=new Date(this.at);
  const hrs=Math.round((Date.now()-d.getTime())/36e5);
  if(hrs<1)return 'updated just now';
  if(hrs<48)return `updated ${hrs}h ago`;
  return 'as of '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
 }
};

/* what a card actually costs you: mid-market + that bank's markup + any flat fee */
function cardRate(card,cur){
 const mid=FX.idr(cur||'USD');
 const mk=(card&&card.markup!=null)?card.markup:0;
 const fee=(card&&card.fee!=null)?card.fee:0;
 return mid*(1+(mk+fee)/100);
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function dObj(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dLabel(s){return dObj(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function dShort(s){const o=dObj(s);return{dd:o.getDate(),mm:o.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}}
function todayISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function daysBetween(a,b){return Math.round((dObj(b)-dObj(a))/864e5)}

/* ═══════════════════ WEATHER ═══════════════════
   Live forecast from Open-Meteo when the date is inside the 16-day
   window; baked seasonal ranges the rest of the time, clearly marked. */
const WX={cache:{},
 icon(c){if(c==null)return'○';if(c===0)return'☀';if(c<3)return'⛅';if(c<50)return'☁';
   if(c<60)return'🌧';if(c<70)return'🌦';if(c<80)return'🌨';return'⛈'},
 async fetch(loc,from,to){

 }};

/* ═══════════════════ IMAGE PIPELINE ═══════════════════
   Resize + re-encode before storing. Browser storage is small, so
   full-resolution photos would fill it after four or five images. */
function processImage(file,maxPx,q){
 return new Promise((res,rej)=>{
  if(!file.type.startsWith('image/'))return rej(new Error('Images only — photograph a document rather than uploading a PDF'));
  const rd=new FileReader();
  rd.onerror=()=>rej(new Error('Could not read that file'));
  rd.onload=()=>{
   const im=new Image();
   im.onerror=()=>rej(new Error('That file is not a readable image'));
   im.onload=()=>{
    let{width:w,height:h}=im;const sc=Math.min(1,maxPx/Math.max(w,h));
    w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);
    c.toBlob(b=>b?res(b):rej(new Error('Could not encode that image')),'image/jpeg',q);
   };im.src=rd.result;
  };rd.readAsDataURL(file);
 });
}

 h+=`<div class="sect-h"><h2>Route</h2></div>
  <div class="card pad"><img class="mapimg" src="assets/maps/overview.png" alt="Full route map"

  <p class="hint" style="display:none">Route map — place <b>assets/maps/overview.png</b> beside index.html to show it here.</p>

 el.innerHTML=h;

}
function countdownStrip(){

function nowRail(idx){

async function loadWeather(){

 // group consecutive days by base so we make few requests
 const today=new Date(),horizon=new Date(today.getTime()+15*864e5);
 let live=0;
 const cells=await Promise.all(slice.map(async d=>{
  const L=LOC[d.base],o=dObj(d.d),inWin=o>=new Date(today.getFullYear(),today.getMonth(),today.getDate())&&o<=horizon;
  let hi=L.cl[1],lo=L.cl[0],code=null,est=true;

<script>
/* ═══════════════════════════════════════════════════════════
   GITHUB SYNC
   Local-first. Every edit lands in this device immediately, so the
   app works with no signal. Sync pushes to a PRIVATE data repo when
   a network is available.

   Merge strategy: every field carries its own timestamp, so two
   devices editing different things both keep their work. Same field
   edited on both within one sync window — newest wins.

   The token is entered per device and stored locally. It is never
   written into the repo.
   ═══════════════════════════════════════════════════════════ */
const CFGKEY='larchcanyon.gh';        // never synced, never committed
const SYNCED=['done','items','bookings','photos','outfits','docs','todos','packing','spend','notes','cards'];
const BY_ID=['bookings','docs','spend','cards'];   // arrays keyed by .id
const STATE_PATH='data/state.json';
const PHOTO_DIR='data/photos';

const Sync={
 cfg:null, busy:false, last:null, err:null, queued:false,
 nudgeT:null, auto:null,

 /* An edit was made. Push it shortly, batching a burst of edits into one
    commit rather than one commit per keystroke. */
 nudge(){
  if(!this.on)return;
  clearTimeout(this.nudgeT);
  this.nudgeT=setTimeout(()=>{
   this.nudgeT=null;
   if(this.on&&!this.busy&&navigator.onLine)this.run(true);
  },15000);
 },
 /* Send anything pending right now — used when the app is being backgrounded,
    because iOS freezes timers and the pending push would otherwise be lost. */
 flush(){
  if(!this.nudgeT)return;
  clearTimeout(this.nudgeT);this.nudgeT=null;
  if(this.on&&!this.busy&&navigator.onLine)this.run(true);
 },
 /* Safety net for edits that never got pushed, and for pulling the other
    phone's changes. Registered once, whether or not sync was on at boot. */
 startAuto(){
  if(this.auto)return;
  this.auto=setInterval(()=>{
   if(this.on&&!this.busy&&navigator.onLine)this.run(true);
  },1000*60*5);
 },

 loadCfg(){try{this.cfg=JSON.parse(localStorage.getItem(CFGKEY)||'null')}catch(e){this.cfg=null}return this.cfg},
 saveCfg(c){this.cfg=c;localStorage.setItem(CFGKEY,JSON.stringify(c))},
 clearCfg(){this.cfg=null;localStorage.removeItem(CFGKEY)},
 get on(){return!!(this.cfg&&this.cfg.token&&this.cfg.owner&&this.cfg.repo)},

 api(path,opts){
  const o=Object.assign({headers:{}},opts||{});
  o.headers['Authorization']='Bearer '+this.cfg.token;
  o.headers['Accept']='application/vnd.github+json';
  o.headers['X-GitHub-Api-Version']='2022-11-28';
  return fetch(`https://api.github.com/repos/${this.cfg.owner}/${this.cfg.repo}/contents/${path}`,o);
 },

 /* ---- base64 helpers that survive unicode ---- */
 enc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s)},
 dec(b64){const bin=atob(b64.replace(/\s/g,''));const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a)},

 async getFile(path){
  const r=await this.api(path+'?ref='+encodeURIComponent(this.cfg.branch||'main'));
  if(r.status===404)return null;
  if(r.status===401)throw new Error('Token rejected. Check it has not expired.');
  if(r.status===403)throw new Error('Access denied. Check the token can write Contents on this repo.');
  if(!r.ok)throw new Error('GitHub returned '+r.status);
  return r.json();
 },
 async putFile(path,b64,sha,msg){
  const body={message:msg||('update '+path),content:b64,branch:this.cfg.branch||'main'};
  if(sha)body.sha=sha;
  const r=await this.api(path,{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw Object.assign(new Error('conflict'),{conflict:true});
  if(!r.ok){let d='';try{d=(await r.json()).message||''}catch(e){}
   throw new Error('Write failed ('+r.status+') '+d)}
  return r.json();
 },

 async test(cfg){
  const keep=this.cfg;this.cfg=cfg;
  try{
   const r=await this.api('?ref='+encodeURIComponent(cfg.branch||'main'));
   if(r.status===404)throw new Error('Repository not found. Check the owner and name, and that the token can see it.');
   if(r.status===401)throw new Error('Token rejected. Check it has not expired.');
   if(r.status===403)throw new Error('Access denied. The token needs Contents: Read and write on this repo.');
   if(!r.ok)throw new Error('GitHub returned '+r.status);
   return true;
  }finally{this.cfg=keep}
 },

 /* ---- merge: per-field last-write-wins ---- */
 merge(local,remote){
  const lt=local._t||{},rt=remote._t||{},out={_t:{}};
  const stamp=(s,k,t)=>{const p=s+':'+k;out._t[p]=t};
  SYNCED.forEach(sec=>{
   const isArr=BY_ID.includes(sec);
   const L=local[sec]||(isArr?[]:{}),R=remote[sec]||(isArr?[]:{});
   const lmap=isArr?Object.fromEntries((L||[]).map(o=>[o.id,o])):L;
   const rmap=isArr?Object.fromEntries((R||[]).map(o=>[o.id,o])):R;
   // union of keys present on either side PLUS keys only known through a
   // tombstone, so deletions survive the round trip to the other device
   const keys=new Set([...Object.keys(lmap||{}),...Object.keys(rmap||{})]);
   const pre=sec+':';
   [lt,rt].forEach(tm=>Object.keys(tm).forEach(p=>{if(p.indexOf(pre)===0)keys.add(p.slice(pre.length))}));
   const merged={};
   keys.forEach(k=>{
    const p=sec+':'+k,a=lt[p]||0,b=rt[p]||0;
    const hasL=Object.prototype.hasOwnProperty.call(lmap||{},k);
    const hasR=Object.prototype.hasOwnProperty.call(rmap||{},k);
    let win,wt;
    if(hasL&&hasR){win=a>=b?lmap[k]:rmap[k];wt=Math.max(a,b)}
    else if(hasL){                    // remote no longer has it
     if(b>a&&b>0){stamp(sec,k,b);return}   // remote deleted it more recently
     win=lmap[k];wt=a;
    }else if(hasR){                   // local no longer has it
     if(a>b&&a>0){stamp(sec,k,a);return}   // local deleted it more recently
     win=rmap[k];wt=b;
    }else{stamp(sec,k,Math.max(a,b));return}  // gone from both — keep the tombstone
    if(win===undefined||win===null){stamp(sec,k,Math.max(a,b));return}
    merged[k]=win;stamp(sec,k,wt||Date.now());
   });
   out[sec]=isArr?Object.values(merged):merged;
  });
  if(out.bookings)out.bookings.sort((x,y)=>x.date<y.date?-1:1);
  return out;
 },

 /* ---- photos live as real files, not base64 inside the JSON ---- */
 async uploadPhotos(state){
  const up=[];
  const pending=v=>v&&typeof v==='object'&&v.p&&!v.f;
  for(const [k,v] of Object.entries(state.photos||{}))if(pending(v))up.push(['photos',k,v]);
  for(const [k,o] of Object.entries(state.outfits||{}))
   ['img','img2'].forEach(f=>{if(o&&pending(o[f]))up.push(['outfits',k+'|'+f,o[f]])});
  (state.docs||[]).forEach(d=>{if(pending(d.img))up.push(['docs',d.id,d.img])});
  let n=0;
  for(const [sec,key,ref] of up){
   const blob=await IDB.get(ref.p);
   if(!blob)continue;
   const path=`${PHOTO_DIR}/${ref.p}.jpg`;
   const b64=await new Promise(res=>{const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(blob)});
   let sha=null;try{const ex=await this.getFile(path);sha=ex&&ex.sha}catch(e){}
   try{
    await this.putFile(path,b64,sha,'photo '+ref.p);
    const nref={p:ref.p,f:path};
    if(sec==='photos')state.photos[key]=nref;
    else if(sec==='outfits'){const[kk,ff]=key.split('|');state.outfits[kk][ff]=nref}
    else{const d=state.docs.find(x=>x.id===key);if(d)d.img=nref}
    n++;
   }catch(e){/* stays local; retried next sync */}
  }
  return n;
 },

 /* fetch a photo file once, then keep it in the device cache */
 async resolve(ref){
  // Already on this device?
  if(!ref||typeof ref!=='object'||!ref.p)return false;
  if(Photos.url[ref.p])return false;
  const have=await IDB.get(ref.p);
  if(have){Photos.url[ref.p]=URL.createObjectURL(have);return true}
  if(!ref.f||!this.on)return false;
  try{
   const j=await this.getFile(ref.f);
   if(!j)return false;
   let b64=j.content;
   // The Contents API returns no body for blobs over 1 MB. A detailed 1800px
   // shot can land there, so fall back to the Blobs API, which has no such cap.
   if((!b64||j.encoding==='none')&&j.sha){
    const r=await fetch(`https://api.github.com/repos/${this.cfg.owner}/${this.cfg.repo}/git/blobs/${j.sha}`,
     {headers:{Authorization:'Bearer '+this.cfg.token,Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'}});
    if(!r.ok)return false;
    b64=(await r.json()).content;
   }
   if(!b64)return false;
   const bin=atob(b64.replace(/\s/g,''));
   const a=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
   await Photos.add(new Blob([a],{type:'image/jpeg'}),ref.p);
   return true;
  }catch(e){return false}
 },

 /* Deleting a photo drops its reference, but the blob stayed in IndexedDB
    forever. Over a three-week trip that quietly eats the phone's storage. */
 async sweepBlobs(){
  const live=new Set();
  Object.values(S.photos||{}).forEach(v=>{if(v&&v.p)live.add(v.p)});
  Object.values(S.outfits||{}).forEach(o=>{if(o)['img','img2'].forEach(f=>{if(o[f]&&o[f].p)live.add(o[f].p)})});
  (S.docs||[]).forEach(d=>{if(d.img&&d.img.p)live.add(d.img.p)});
  const keys=await IDB.keys();
  // A state that references nothing while the device holds blobs means the
  // merge went wrong, not that everything was deleted. Never sweep on that.
  if(!live.size&&keys.length)return;
  for(const k of keys){
   if(live.has(k))continue;
   await Photos.remove(k);
  }
 },

 async run(silent,depth){
  depth=depth||0;
  if(!this.on){if(!silent)toast('Set up GitHub sync first');return false}
  if(this.busy){this.queued=true;return false}
  if(!navigator.onLine){this.err='offline';paintSync();if(!silent)toast('No connection — saved on this device');return false}
  this.busy=true;this.err=null;paintSync();
  try{
   const remoteFile=await this.getFile(STATE_PATH);
   let remote={_t:{}};
   if(remoteFile&&remoteFile.content){
    try{remote=JSON.parse(this.dec(remoteFile.content))}catch(e){remote={_t:{}}}
   }
   let merged=this.merge(S,remote);
   const uploaded=await this.uploadPhotos(merged);
   merged._t=merged._t||{};merged._updated=new Date().toISOString();merged._by=this.cfg.device||'device';
   const body=this.enc(JSON.stringify(merged,null,1));
   try{
    await this.putFile(STATE_PATH,body,remoteFile&&remoteFile.sha,'sync from '+(this.cfg.device||'device'));
   }catch(e){
    // someone else wrote; redo the merge against their version, but do not
    // ping-pong forever if both phones are syncing at once
    if(e.conflict&&depth<4){this.busy=false;return this.run(silent,depth+1)}
    if(e.conflict)throw new Error('Both phones are syncing at once — try again in a moment');
    throw e;
   }
   Object.keys(merged).forEach(k=>{S[k]=merged[k]});
   await Store.save();
   await hydratePhotos().catch(()=>{});
   await this.sweepBlobs().catch(()=>{});
   this.last=new Date();this.err=null;
   if(!silent)toast(uploaded?`Synced · ${uploaded} photo${uploaded===1?'':'s'} uploaded`:'Synced');
   return true;
  }catch(e){
   this.err=e.message||'Sync failed';
   if(!silent)toast(this.err);
   return false;
  }finally{
   this.busy=false;paintSync();
   if(this.queued){this.queued=false;setTimeout(()=>this.run(true),900)}
   render();
  }
 }
};

/* ---- stamp every change so the merge knows what is newest ---- */
function touch(section,key){S._t=S._t||{};S._t[section+':'+key]=Date.now()}

/* ---- header sync chip ---- */
function paintSync(){
 const el=document.getElementById('syncchip');if(!el)return;
 if(Store.failed){el.className='chip bad';el.textContent='not saved';return}
 if(!Sync.on){el.className='chip';el.textContent='local only';return}
 if(Sync.busy){el.className='chip busy';el.textContent='syncing…';return}
 if(Sync.err){el.className='chip bad';el.textContent=Sync.err==='offline'?'offline':'sync failed';return}

 el.textContent=Sync.last?'synced '+Sync.last.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'sync ready';
}

/* ---- resolve remote photo refs into displayable images ---- */
async function hydratePhotos(){
 const refs=[];
 Object.values(S.photos||{}).forEach(v=>{if(v&&v.p)refs.push(v)});
 Object.values(S.outfits||{}).forEach(o=>{if(o){['img','img2'].forEach(f=>{if(o[f]&&o[f].p)refs.push(o[f])})}});
 (S.docs||[]).forEach(d=>{if(d.img&&d.img.p)refs.push(d.img)});
 const todo=refs.filter(r=>!Photos.url[r.p]);
 if(!todo.length)return false;
 let got=0;
 for(const r of todo){if(await Sync.resolve(r))got++}
 return got>0;
}

window.addEventListener('online',()=>{if(Sync.on)Sync.run(true)});

/* iOS suspends a backgrounded PWA, so the 5-minute timer cannot be relied on.
   Push pending edits on the way out, and pull the other phone's on the way in. */
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){Sync.flush();return}
 if(Sync.on&&!Sync.busy&&navigator.onLine)Sync.run(true);
});
window.addEventListener('pagehide',()=>Sync.flush());

   ${pct>88?'<div class="alert" style="margin-top:9px"><b>Device storage is getting full</b>This is your phone\'s free space, not an app limit. Photos already synced are safe in the data repo and can be re-downloaded.</div>':'<p class="hint" style="margin-top:7px">Photos are held as binary in IndexedDB, so the ceiling is your device\'s free space rather than a fixed few megabytes. Synced photos also live in the data repo.</p>'}
  </div>
  <div class="card pad">
   <div class="eyebrow">App updates</div>
   <p class="hint" style="margin-bottom:9px">This build is <b>${BUILD}</b>. The app checks for a newer version every time it opens while online. If you have uploaded new files and still see the old screen, clear the cached copy here.</p>
   <button class="btn ghost" id="freshen">Fetch the latest version</button>
  </div>
  <div class="card pad">
   <div class="eyebrow">Reset</div>
   <p class="hint" style="margin-bottom:9px">Clears every tick, booking, photo and note. The itinerary itself is built in and always returns.</p>
   <button class="btn warn" id="wipe">Erase all my data</button>
  </div>
  <div class="card pad">
   <div class="eyebrow">About</div>
   <p class="hint">Larch &amp; Canyon — built for Kenny and Hershania's honeymoon, 14 September to 6 October 2026.
   Weather from Open-Meteo when the date is inside the 16-day forecast window; otherwise seasonal ranges, marked with ≈.
   Exchange rates by <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>, cached on the device so conversions still work offline.
   Photos are held in IndexedDB, so capacity is your device's free space rather than a fixed few megabytes.
   Works offline once loaded, apart from live weather and rates.</p>
   <div class="kv" style="margin-top:9px"><span class="k">Build</span><span class="v">${BUILD}</span></div>
  </div>
  <section class="view" id="v-print"></section>`;

 const sb=$('#syncbox');
 if(Sync.on){
  sb.innerHTML=`<div class="kv"><span class="k">Repository</span><span class="v">${esc(Sync.cfg.owner)}/${esc(Sync.cfg.repo)}</span></div>
   <div class="kv"><span class="k">This device</span><span class="v">${esc(Sync.cfg.device||'device')}</span></div>
   <div class="kv"><span class="k">Status</span><span class="v">${Sync.busy?'syncing…':Sync.err?esc(Sync.err):Sync.last?'synced '+Sync.last.toLocaleTimeString():'ready'}</span></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="syncnow"${Sync.busy?' disabled':''}>Sync now</button>
   <button class="btn ghost" id="syncset">Settings</button></div>`;
 }else{
  sb.innerHTML=`<p class="hint" style="margin-bottom:10px">Off. Everything is saved on this device only — nothing reaches Hershania's phone. Connect a private GitHub repository and both devices stay in step, with edits merged field by field.</p>
   <button class="btn" id="syncset">Set up GitHub sync</button>`;
 }
 if($('#syncnow'))$('#syncnow').onclick=()=>Sync.run();
 if($('#syncset'))$('#syncset').onclick=syncSheet;
 $('#freshen').onclick=async()=>{
  toast('Clearing the cached copy…');
  try{
   if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}
   if(navigator.serviceWorker){
    const rs=await navigator.serviceWorker.getRegistrations();
    for(const r of rs)await r.unregister();
   }
  }catch(e){}
  setTimeout(()=>location.reload(true),700);
 };
 $('#pemb').onclick=printPack;
 $('#dl').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'larch-canyon',v:2,when:new Date().toISOString(),data:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='honeymoon-backup-'+todayISO()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Backup downloaded');
 };
 $('#up').onclick=()=>{
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
   r.onload=()=>{try{const j=JSON.parse(r.result);
    if(!j.data)throw 0;
    if(!confirm('Restore this backup? It replaces everything currently on this device.'))return;
    S=Object.assign({done:{},items:{},bookings:[],photos:{},outfits:{},docs:[],todos:{},packing:{},spend:[],notes:{},cards:[]},j.data);
    save();render();toast('Backup restored');
   }catch(e){toast('That file is not a Larch & Canyon backup')}};
   r.readAsText(f)};
  i.click();
 };
 $('#wipe').onclick=async()=>{
  if(!confirm('Erase everything stored on this device? This cannot be undone.'))return;
  if(!confirm('Really sure? Download a backup first if you might want it back.'))return;
  for(const k of Object.keys(Photos.url)){URL.revokeObjectURL(Photos.url[k]);await IDB.del(k)}
  Photos.url={};
  S={done:{},items:{},bookings:[],photos:{},outfits:{},docs:[],todos:{},packing:{},spend:[],notes:{},cards:[],v:1};
  save();render();toast('All data erased');
 };
}
function printPack(){
 const p=$('#v-print');
 p.innerHTML=`<div style="font-family:var(--b)">
  <h1 style="font-size:22pt;margin-bottom:2mm">Travel Itinerary — United States &amp; Canada</h1>
  <p style="font-family:var(--m);font-size:9pt;letter-spacing:.08em;text-transform:uppercase;color:#555;margin-bottom:6mm">
   Kenichi Edbert Yauwanta &amp; Hershania · 14 September – 6 October 2026 · 22 days</p>
  <h2 style="font-size:13pt;margin:6mm 0 2mm">Confirmed flights</h2>
  <table style="width:100%;border-collapse:collapse;font-size:9.5pt">
   ${TRIP.flights.map(f=>`<tr style="border-bottom:1px solid #ddd">
    <td style="padding:2mm 0"><b>${esc(f.code)}</b></td><td>${esc(f.from)} → ${esc(f.to)}</td>
    <td style="text-align:right">${dLabel(f.date)}</td>
    <td style="text-align:right;font-family:var(--m)">${f.dep} – ${f.arr}</td></tr>`).join('')}
  </table>
  ${S.bookings.length?`<h2 style="font-size:13pt;margin:6mm 0 2mm">Confirmed accommodation and bookings</h2>
   <table style="width:100%;border-collapse:collapse;font-size:9.5pt">
   ${S.bookings.map(b=>`<tr style="border-bottom:1px solid #ddd">
    <td style="padding:2mm 0;white-space:nowrap">${dLabel(b.date)}</td>
    <td><b>${esc(b.name)}</b>${b.addr?'<br><span style="color:#555">'+esc(b.addr)+'</span>':''}</td>
    <td style="text-align:right;font-family:var(--m)">${esc(b.conf||'')}</td></tr>`).join('')}
   </table>`:''}
  <h2 style="font-size:13pt;margin:6mm 0 2mm">Day by day</h2>
  ${DAYS.map((d,i)=>`<div style="break-inside:avoid;margin-bottom:4mm">
   <div style="border-bottom:1.5pt solid #1B2A24;padding-bottom:1mm;margin-bottom:1.5mm">
    <b style="font-size:11pt">Day ${i+1} · ${dLabel(d.d)} — ${esc(d.t)}</b><br>
    <span style="font-size:9pt;color:#555">${esc(LOC[d.base].n)}, ${esc(LOC[d.base].a)} · ${esc(d.stay)}${d.drive!=='—'?' · '+d.drive+' driving':''}</span></div>
   <table style="width:100%;border-collapse:collapse;font-size:9pt">
   ${d.s.map((it,si)=>`<tr><td style="width:14mm;vertical-align:top;font-family:var(--m);padding:.7mm 0">${itemTime(i,si)}</td>
    <td style="padding:.7mm 0">${esc(it[1])}</td></tr>`).join('')}
   </table></div>`).join('')}
  <p style="font-size:8.5pt;color:#555;margin-top:6mm;border-top:1px solid #ccc;padding-top:2mm">
   Return to Jakarta confirmed for 6 October 2026 on EVA Air BR 237, arriving 13:20.
   Generated ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}.</p></div>`;
 $$('.view').forEach(v=>v.classList.remove('printing'));
 p.classList.add('printing');
 setTimeout(()=>{window.print();setTimeout(()=>p.classList.remove('printing'),400)},120);
}

/* ═══════════════════ BOOT ═══════════════════ */
function render(){
 const y=window.scrollY;
 header();
 Promise.resolve(({now:vNow,route:vRoute,book:vBook,pack:vPack,scrap:vScrap,money:vMoney,out:vOut}[view]||vNow)()).catch(e=>console.warn(e));
 requestAnimationFrame(()=>window.scrollTo(0,y));
}
if('serviceWorker'in navigator&&location.protocol==='https:'){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
   reg.update();
   reg.addEventListener('updatefound',()=>{
    const w=reg.installing;if(!w)return;
    w.addEventListener('statechange',()=>{
     if(w.state==='installed'&&navigator.serviceWorker.controller){
      toast('New version ready — reopening');
      w.postMessage('skipWaiting');
      setTimeout(()=>location.reload(),1200);
     }
    });
   });
  }).catch(()=>{});
 });
}
(async function init(){
 const m=await Store.load();
 S=Object.assign({done:{},items:{},bookings:[],photos:{},outfits:{},docs:[],todos:{},packing:{},spend:[],notes:{},cards:[],v:1},m||{});

 Sync.loadCfg();
 FX.load();FX.refresh().then(()=>{if(view==='money')render()});
 try{
  await IDB.open();
  await Photos.loadAll();
  if(navigator.storage&&navigator.storage.persist){
   Photos.persisted=await navigator.storage.persisted?await navigator.storage.persisted():false;
   if(!Photos.persisted)Photos.persisted=await navigator.storage.persist().catch(()=>false);
  }
 }catch(e){console.warn('photo store unavailable',e)}
 buildNav();render();
 migratePhotos().then(a=>migrateFileRefs().then(b=>{if(a||b)render()})).catch(e=>console.warn('migration',e));
 const chip=document.getElementById('syncchip');
 if(chip)chip.onclick=()=>{if(Sync.on&&!Sync.busy)Sync.run();else syncSheet()};
 paintSync();
 // registered unconditionally: connecting sync mid-session used to leave the
 // device with no timer at all until the next reload
 Sync.startAuto();
 if(Sync.on){
  await hydratePhotos().then(ok=>{if(ok)render()}).catch(()=>{});
  Sync.run(true);
 }
 const ph=tripPhase();
 if(ph.p==='during')setInterval(()=>{if(view==='now')vNow()},60000);
})();

</script>
